apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rules
  labels: {{- include "qg.labels" . | nindent 4 }}
data:
  rules.yml: |
{{- if .Values.rulesFile }}
{{ .Values.rulesFile | indent 4 }}
{{- else }}
{{ .Files.Get "files/default-rules.yml" | indent 4 }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qg.secretName" . }}
  labels: {{- include "qg.labels" . | nindent 4 }}
type: Opaque
stringData:
  explain-password: {{ .Values.secrets.explainPassword | quote }}
  config-password: {{ .Values.secrets.configPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
  viewer-password: {{ .Values.secrets.viewerPassword | quote }}
{{- end }}
