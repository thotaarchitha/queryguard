# QueryGuard starting policy.
#
# The proxy reads this file directly when there's no config database. Once the admin
# API is running, this only seeds the config DB on first start, and the API owns the rules.
#
# Rules run in priority order (lowest first). The first BLOCK wins; REWRITE rules stack.
# Message placeholders: {cost} {rows} {statement} {function} {table} {role} {user}

default_role: app

role_mapping:
  postgres: admin
  alice: analyst
  bob: app
  etl_user: etl
  report_ro: app_readonly

settings:
  # A statement JSqlParser can't read: reads go through, anything else is refused.
  on_parse_error: allow_reads
  # EXPLAIN failed or timed out: estimate from table statistics instead (full-scan upper bound).
  # "allow" here turned an overloaded database into a worse one; see docs/bug-journal.md.
  on_cost_error: estimate
  explain_timeout_ms: 200
  decision_timeout_ms: 1000

rules:
  - id: R1
    name: block-unbounded-writes
    priority: 10
    when:
      statement: [UPDATE, DELETE]
      has_where: false
    action: BLOCK
    sqlstate: "42501"
    message: "QueryGuard R1: {statement} without a WHERE clause would touch every row."

  - id: R2
    name: block-destructive-ddl
    priority: 20
    when:
      statement: [DROP, TRUNCATE]
      roles_except: [admin]
    action: BLOCK
    sqlstate: "42501"
    message: "QueryGuard R2: {statement} is only allowed for admins."

  - id: R8
    name: block-risky-functions
    priority: 25
    when:
      functions_any: [pg_sleep, pg_read_file, pg_read_binary_file, pg_ls_dir, dblink, dblink_exec, lo_import, lo_export]
    action: BLOCK
    sqlstate: "42501"
    message: "QueryGuard R8: {function}() isn't allowed through the proxy."

  - id: R6
    name: block-cross-joins
    priority: 28
    when:
      statement: [SELECT, UPDATE, DELETE]
      has_cross_join: true
    action: BLOCK
    sqlstate: "42601"
    message: "QueryGuard R6: cross join or a join with no condition. Add an ON clause."

  - id: R3
    name: block-expensive-analyst-queries
    priority: 30
    when:
      roles: [analyst]
      statement: [SELECT]
      estimated_cost_gt: 100000
    action: BLOCK
    sqlstate: "54000"
    message: "QueryGuard R3: estimated cost {cost} is over the 100000 limit for analysts. Add filters or a LIMIT."

  - id: R5
    name: block-select-star-on-huge-tables
    priority: 40
    when:
      statement: [SELECT]
      select_star: true
      estimated_rows_gt: 1000000
      roles_except: [etl, admin]
    action: BLOCK
    sqlstate: "54000"
    message: "QueryGuard R5: SELECT * over ~{rows} rows. Name the columns you need."

  - id: R7
    name: block-writes-outside-maintenance
    priority: 60
    when:
      roles: [app_readonly]
      statement: [INSERT, UPDATE, DELETE, MERGE]
      outside_window: { days: [SAT, SUN], from: "02:00", to: "04:00", tz: "UTC" }
    action: BLOCK
    sqlstate: "25006"
    message: "QueryGuard R7: {role} can only write during the weekend maintenance window (Sat/Sun 02:00-04:00 UTC)."

  - id: R4
    name: cap-analyst-result-size
    priority: 90
    when:
      roles: [analyst]
      statement: [SELECT]
      has_limit: false
    action: REWRITE
    rewrite:
      add_limit: 1000

masking:
  - table: customers
    column: email
    strategy: partial_email
    roles: [analyst]
  - table: customers
    column: phone
    strategy: last4
    roles: [analyst]
  - table: customers
    column: card_last4
    strategy: redact
    except_roles: [admin]
