name: queryguard_analytics
version: "1.0.0"
config-version: 2
profile: queryguard

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

# The streaming path (Kafka engine -> materialized views) keeps raw events and the hourly
# rollups fresh to the second. dbt owns the slower, more opinionated layer on top: daily marts
# with business definitions, and tests that would catch the pipeline drifting.
models:
  queryguard_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
