global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: queryguard-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy:8081"]

  - job_name: queryguard-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["admin-api:8080"]
