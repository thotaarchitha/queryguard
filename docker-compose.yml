name: queryguard

# Everything QueryGuard needs, one command:  docker compose up -d --build --wait
# Then: psql on 6432, admin API on 8080 (Swagger at /swagger-ui.html), Grafana on 3000.
# Add live traffic:  docker compose --profile traffic up -d
#
# All passwords here are local-demo values. The Helm chart takes real ones from Secrets.

x-pg-env: &pg-env
  QG_PG_HOST: postgres
  QG_PG_PORT: "5432"
  QG_EXPLAIN_USER: qg_explain
  QG_EXPLAIN_PASSWORD: qg_explain
  QG_CONFIG_DB_URL: jdbc:postgresql://postgres:5432/queryguard_config
  QG_CONFIG_DB_USER: qg_config
  QG_CONFIG_DB_PASSWORD: qg_config

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: shop
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    ports:
      - "5432:5432"
    volumes:
      - ./infra/seed/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./infra/seed/02-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: during the seed, postgres only listens on its unix
      # socket, so a socket check would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 180s

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: qg
      CLICKHOUSE_PASSWORD: qg
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - ./analytics/clickhouse:/docker-entrypoint-initdb.d:ro
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      kafka:
        condition: service_healthy

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    environment:
      <<: *pg-env
      QG_JWT_SECRET: compose-demo-secret-not-for-production-0123456789
      QG_CLICKHOUSE_URL: http://clickhouse:8123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      <<: *pg-env
      QG_LISTEN_PORT: "6432"
      QG_ADMIN_PORT: "8081"
      QG_KAFKA_BOOTSTRAP: kafka:9092
      QG_INSTANCE: qg-0
    ports:
      - "6432:6432"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      admin-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./analytics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/query-analytics.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./analytics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./analytics/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - clickhouse

  traffic:
    profiles: ["traffic"]
    build: ./bench/traffic
    environment:
      QG_HOST: proxy
      QG_PORT: "6432"
      DURATION_S: ${TRAFFIC_DURATION_S:-86400}
      RATE: ${TRAFFIC_RATE:-150}
      WORKER_SCALE: ${TRAFFIC_WORKER_SCALE:-1}
    depends_on:
      proxy:
        condition: service_healthy

  dbt:
    profiles: ["dbt"]
    build: ./analytics/dbt
    environment:
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./analytics/dbt:/dbt
    command: ["build"]
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  pgdata:
  chdata:
